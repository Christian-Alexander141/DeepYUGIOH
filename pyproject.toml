[project]
name = "deepyugioh"
version = "0.1.0"
description = "Autonomous Yu-Gi-Oh! strategy research system - Phase 1: combo generator"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
deepyugioh = "deepyugioh.cli:main"

[dependency-groups]
dev = ["pytest>=8", "meson>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepyugioh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
